version: 2

models:
  - name: dim_customers
    description: "The primary customer dimension table. Combines cleaned profile details with their latest active subscription status and MRR."
    columns:
      - name: customer_id
        data_type: string
        description: "Primary key. Unique identifier for each customer."
        data_tests:
          - unique
          - not_null

      - name: customer_email
        data_type: string
        description: "The customer's email address."

      - name: is_valid_email_format
        data_type: bool
        description: "Flag indicating whether the email format passed semantic validation."

      - name: country_code
        data_type: string
        description: "Two-letter ISO country code."

      - name: acquisition_channel_id
        data_type: string
        description: "Foreign key referencing the marketing channel seed."
        data_tests:
          - relationships:
              arguments:
                to: ref('raw_marketing_channels')
                field: channel_id

      - name: signed_up_at
        data_type: timestamp
        description: "Timestamp when the customer profile was created."

      - name: current_plan_id
        data_type: string
        description: "Foreign key referencing the customer's current active plan. Defaults to 'unsubscribed' if none."
        data_tests:
          - relationships:
              arguments:
                to: ref('raw_plans')
                field: plan_id

      - name: current_status
        data_type: string
        description: "The customer's current subscription lifecycle status (e.g., active, inactive)."

      - name: current_mrr
        data_type: numeric
        description: "The exact MRR amount generated by the customer's current plan."

      - name: trial_conversion_cohort
        data_type: string
        description: "Cohort describing how the customer's first subscription evolved (trial upgraded, cancelled, still active, or direct paid sign-up)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Trial Upgraded', 'Trial Cancelled', 'Active Trial', 'Direct Sign-up', 'Unknown']

  - name: fct_subscriptions_historical
    description: "An incremental fact table tracking the historical lifecycle and date boundaries of all subscription records. Each run merges new subscriptions and re-merges any still-open ones so status and end dates stay current."
    columns:
      - name: subscription_id
        data_type: string
        description: "Primary key. Unique identifier for the specific subscription record state."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_type: string
        description: "Foreign key mapping back to the dim_customers table."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: subscription_plan
        data_type: string
        description: "The raw plan name assigned to the subscription."

      - name: mrr_amount
        data_type: numeric
        description: "The recorded Monthly Recurring Revenue amount for this history slice."

      - name: subscription_status
        data_type: string
        description: "The state of the subscription during this historical window."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'cancelled', 'upgraded']

      - name: valid_from_date
        data_type: date
        description: "The start date of this historical record slice."

      - name: valid_to_date
        data_type: date
        description: "The end date of this historical record slice. Null while the subscription is still ongoing."

      - name: is_currently_active
        data_type: bool
        description: "Boolean flag identifying if this row represents a currently active subscription state."

  - name: dim_plans
    description: "The primary subscription plan dimension table. Built from the raw plan catalog seed."
    columns:
      - name: plan_id
        data_type: string
        description: "Primary key. Unique identifier for the specific plans."
        data_tests:
          - unique
          - not_null

      - name: subscription_plan
        data_type: string
        description: "The raw plan name assigned to the subscription."

      - name: tier_level
        data_type: int64
        description: "Tier level of plans.  Higher number indicates a more expensive plan."

  - name: dim_marketing_channels
    description: "The marketing channel dimension table derived from the raw marketing channel seed data."
    columns:
      - name: channel_id
        data_type: string
        description: "Primary key. Unique identifier for the specific marketing channels."
        data_tests:
          - unique
          - not_null

      - name: channel_name
        data_type: string
        description: "The name of the marketing channel."

      - name: channel_type
        data_type: string
        description: "The type of the marketing channel (e.g., organic, paid, referral, etc.)."

  - name: fct_customer_value
    description: "A fact table tracking current customer value metrics, rebuilt in full on every run."
    columns:
      - name: customer_id
        data_type: string
        description: "Primary key. Unique identifier for each customer."
        data_tests:
          - unique
          - not_null

      - name: customer_email
        data_type: string
        description: "The customer's email address."

      - name: country_code
        data_type: string
        description: "Two-letter ISO country code."

      - name: channel_name
        data_type: string
        description: "The name of the marketing channel."

      - name: signed_up_at
        data_type: timestamp
        description: "Timestamp when the customer profile was created."

      - name: current_plan
        data_type: string
        description: "The customer's current active plan. Defaults to 'unsubscribed' if none."

      - name: current_status
        data_type: string
        description: "The customer's current subscription lifecycle status (e.g., active, inactive)."

      - name: current_mrr
        data_type: numeric
        description: "The exact MRR amount generated by the customer's current plan."

      - name: trial_conversion_cohort
        data_type: string
        description: "Cohort describing how the customer's first subscription evolved (trial upgraded, cancelled, still active, or direct paid sign-up)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Trial Upgraded', 'Trial Cancelled', 'Active Trial', 'Direct Sign-up', 'Unknown']
